spring.application.name=troc-api

# TP 2 : affiche le message des erreurs (ex. "Utilisateur 42 introuvable") dans le corps JSON des réponses
spring.web.error.include-message=always

# TP 3 et 4 : règles métier du troc
troc.item.max-per-user=20
troc.trade.max-pending=3

# Annexe 1 (bonus du TP 1) : Swagger UI (http://localhost:8080/swagger-ui.html)
# Bouton « Try it out » déjà activé, et opérations triées par méthode HTTP
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
