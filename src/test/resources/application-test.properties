# Séance 4 : profil "test", une base H2 en mémoire, vide à chaque lancement des tests.
# Seules l'URL de la base et la clé JWT changent : le reste de src/main/resources/application.properties s'applique toujours.
spring.datasource.url=jdbc:h2:mem:troc-test;CASE_INSENSITIVE_IDENTIFIERS=TRUE
# Clé de test, sans valeur secrète : les tests (et la CI) n'ont pas la variable TROC_JWT_SECRET.
troc.jwt.secret=cle-de-test-uniquement-pas-un-vrai-secret
