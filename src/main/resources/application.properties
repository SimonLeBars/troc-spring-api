spring.application.name=troc-api

# Affiche le message des erreurs (ex. "Utilisateur 42 introuvable") dans le corps JSON des réponses
spring.web.error.include-message=always

# Règles métier du troc
troc.item.max-per-user=20
troc.trade.max-pending=3

# Séance 3 : une base H2 dans un fichier du projet (dossier data/, ignoré par git)
spring.datasource.url=jdbc:h2:file:./data/troc;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
# Exécuter schema.sql à chaque démarrage (par défaut : seulement pour une base en mémoire)
spring.sql.init.mode=always
# Interface web d'administration : http://localhost:8080/h2-console
spring.h2.console.enabled=true
# Afficher dans la console chaque requête SQL envoyée à la base
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
